events {
    worker_connections 1024;
}

http {
    upstream sentinel_gateways {
        # Round-robin across gateway replicas -- demonstrates that the
        # gateway is stateless enough not to need sticky sessions for
        # ordinary HTTP traffic (Section 79).
        server gateway-1:8000;
        server gateway-2:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://sentinel_gateways;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
