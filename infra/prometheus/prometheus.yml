global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: sentinel-gateway
    static_configs:
      - targets: ["gateway-1:8000", "gateway-2:8000"]
        labels:
          service: sentinel-gateway

  - job_name: sentinel-control-plane
    static_configs:
      - targets: ["control-plane:8001"]
        labels:
          service: sentinel-control-plane
